<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b55">
<meta name="description" content="ALLIN ONE - Buy, Sell and Connect">
<title>ALLIN ONE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7f6;color:#222;padding-bottom:75px}
header{background:#087b55;color:white;padding:13px 15px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:22px;font-weight:bold;letter-spacing:.5px}
#languageSelect{padding:9px;border:0;border-radius:8px;background:white;color:#087b55;font-weight:bold;max-width:135px}
.search-area{display:flex;gap:7px;margin-top:12px}
.search-area input{flex:1;min-width:0;padding:11px;border:0;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:10px 13px;background:#087b55;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
main{max-width:900px;margin:auto;padding:14px}
.page{display:none}
.page.active{display:block}
h2{font-size:20px;margin:10px 0 14px;color:#087b55}
h3{margin-bottom:8px}
.categories{display:flex;gap:8px;overflow:auto;padding:12px 0}
.categories button{white-space:nowrap;background:#e1eee9;color:#087b55}
.categories button.active{background:#087b55;color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #00000010}
.card img{width:100%;height:145px;object-fit:cover;background:#eee}
.card-body{padding:10px}
.card-body h3{font-size:16px;overflow-wrap:anywhere}
.price{font-weight:bold;color:#087b55;margin:7px 0}
.muted{color:#777;font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.actions button{font-size:12px;padding:8px}
.secondary{background:#e7efeb;color:#087b55}
.danger{background:#c0392b}
.form-box,.panel{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0000000c}
input,textarea,select{width:100%;padding:11px;border:1px solid #d6ded9;border-radius:8px;margin:6px 0 12px;font-size:15px}
textarea{min-height:90px;resize:vertical}
label{font-weight:bold;font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002;z-index:30}
.bottom-nav button{background:white;color:#555;border-radius:7px;padding:7px 4px;font-size:11px;flex:1}
.bottom-nav button.active{color:#087b55}
.bottom-nav span{display:block;font-size:19px;margin-bottom:3px}
.notice{padding:10px;border-radius:8px;background:#fff4d6;color:#745500;margin:10px 0;font-size:13px}
.empty{text-align:center;color:#777;padding:30px 10px}
.hidden{display:none!important}
hr{border:0;border-top:1px solid #eee;margin:12px 0}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card img{height:180px}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">🛍️ ALLIN ONE</div>
    <div class="top-actions">
      <select id="languageSelect" aria-label="Choose language" onchange="setLanguage(this.value)">
        <option value="am">🇪🇹 አማርኛ</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>
  </div>
  <div class="search-area">
    <input id="searchInput" placeholder="ምርት ፈልግ..." oninput="renderProducts()">
    <button onclick="renderProducts()">🔍</button>
  </div>
</header>

<main>
  <section id="homePage" class="page active">
    <div class="categories" id="categoryButtons">
      <button class="active" onclick="setCategory('all',this)" data-am="ሁሉም" data-en="All">ሁሉም</button>
      <button onclick="setCategory('phone',this)" data-am="ስልክ" data-en="Phones">ስልክ</button>
      <button onclick="setCategory('electronics',this)" data-am="ኤሌክትሮኒክስ" data-en="Electronics">ኤሌክትሮኒክስ</button>
      <button onclick="setCategory('clothes',this)" data-am="ልብስ" data-en="Clothes">ልብስ</button>
      <button onclick="setCategory('home',this)" data-am="የቤት እቃ" data-en="Home">የቤት እቃ</button>
      <button onclick="setCategory('cars',this)" data-am="መኪና" data-en="Cars">መኪና</button>
      <button onclick="setCategory('others',this)" data-am="ሌሎች" data-en="Others">ሌሎች</button>
    </div>
    <h2 data-am="የቅርብ ጊዜ ምርቶች" data-en="Latest Products">የቅርብ ጊዜ ምርቶች</h2>
    <div id="productsGrid" class="grid"><div class="empty">Loading...</div></div>
  </section>

  <section id="sellPage" class="page">
    <h2 data-am="ምርት ለመሸጥ" data-en="Sell a Product">ምርት ለመሸጥ</h2>
    <div class="form-box">
      <label data-am="የምርት ስም" data-en="Product name">የምርት ስም</label>
      <input id="productName" placeholder="ምሳሌ: Samsung phone">
      <label data-am="ዋጋ (ብር)" data-en="Price (ETB)">ዋጋ (ብር)</label>
      <input id="productPrice" type="number" min="1" placeholder="ዋጋ">
      <label data-am="ምድብ" data-en="Category">ምድብ</label>
      <select id="productCategory">
        <option value="phone">ስልክ / Phones</option>
        <option value="electronics">ኤሌክትሮኒክስ / Electronics</option>
        <option value="clothes">ልብስ / Clothes</option>
        <option value="home">የቤት እቃ / Home</option>
        <option value="cars">መኪና / Cars</option>
        <option value="others">ሌሎች / Others</option>
      </select>
      <label data-am="የምርት መግለጫ" data-en="Description">የምርት መግለጫ</label>
      <textarea id="productDescription" placeholder="ስለ ምርቱ ይግለጹ"></textarea>
      <label data-am="ስልክ ቁጥር" data-en="Phone number">ስልክ ቁጥር</label>
      <input id="sellerPhone" type="tel" placeholder="09xxxxxxxx">
      <label data-am="የምርት ፎቶ" data-en="Product image">የምርት ፎቶ</label>
      <input id="productImage" type="file" accept="image/*">
      <button id="publishButton" onclick="publishProduct()" style="width:100%" data-am="ምርቱን አሳትም" data-en="Publish Product">ምርቱን አሳትም</button>
    </div>
  </section>

  <section id="favoritesPage" class="page">
    <h2 data-am="የወደድኳቸው" data-en="Favorites">የወደድኳቸው</h2>
    <div id="favoritesGrid" class="grid"></div>
  </section>

  <section id="cartPage" class="page">
    <h2 data-am="የግዢ ቅርጫት" data-en="Shopping Cart">የግዢ ቅርጫት</h2>
    <div id="cartItems"></div>
    <div class="panel">
      <h3><span data-am="ጠቅላላ" data-en="Total">ጠቅላላ</span>: <span id="cartTotal">0</span> ETB</h3>
      <button onclick="checkout()" style="width:100%;margin-top:10px" data-am="ትዕዛዝ አስገባ" data-en="Place Order">ትዕዛዝ አስገባ</button>
    </div>
  </section>

  <section id="chatPage" class="page">
    <h2 data-am="መልዕክቶች" data-en="Messages">መልዕክቶች</h2>
    <div id="chatList"></div>
    <div class="form-box">
      <label data-am="የሚላክለት UID" data-en="Recipient UID">የሚላክለት UID</label>
      <input id="chatRecipient" placeholder="Seller UID">
      <label data-am="መልዕክት" data-en="Message">መልዕክት</label>
      <textarea id="chatMessage" placeholder="መልዕክብህን ጻፍ"></textarea>
      <button onclick="sendMessage()" style="width:100%" data-am="ላክ" data-en="Send">ላክ</button>
    </div>
  </section>

  <section id="accountPage" class="page">
    <h2 data-am="መለያ" data-en="Account">መለያ</h2>
    <div class="form-box" id="authBox">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="name@example.com">
      <label data-am="የይለፍ ቃል" data-en="Password">የይለፍ ቃል</label>
      <input id="authPassword" type="password" placeholder="Password">
      <div class="row">
        <button onclick="loginUser()" data-am="ግባ" data-en="Login">ግባ</button>
        <button class="secondary" onclick="registerUser()" data-am="መለያ ፍጠር" data-en="Register">መለያ ፍጠር</button>
      </div>
    </div>
    <div id="userBox" class="panel hidden">
      <p id="userEmail"></p>
      <p class="muted" id="userUid"></p>
      <div class="actions">
        <button onclick="showPage('sellerPage')" data-am="የእኔ ምርቶች" data-en="My Products">የእኔ ምርቶች</button>
        <button onclick="showPage('ordersPage')" data-am="ትዕዛዞቼ" data-en="My Orders">ትዕዛዞቼ</button>
        <button class="danger" onclick="logoutUser()" data-am="ውጣ" data-en="Logout">ውጣ</button>
      </div>
    </div>
  </section>

  <section id="sellerPage" class="page">
    <h2 data-am="የሻጭ ዳሽቦርድ" data-en="Seller Dashboard">የሻጭ ዳሽቦርድ</h2>
    <div id="sellerProducts"></div>
    <h2 data-am="የተቀበልኳቸው ትዕዛዞች" data-en="Received Orders">የተቀበልኳቸው ትዕዛዞች</h2>
    <div id="sellerOrders"></div>
  </section>

  <section id="ordersPage" class="page">
    <h2 data-am="ትዕዛዞቼ" data-en="My Orders">ትዕዛዞቼ</h2>
    <div id="myOrders"></div>
  </section>

  <section id="adminPage" class="page">
    <h2>Admin Dashboard</h2>
    <div class="notice">የአስተዳዳሪ ገጽ ነው። የFirestore Rules ላይም የአስተዳዳሪ ፈቃድ መጠበቅ አለበት።</div>
    <div id="adminOrders"></div>
    <h2 data-am="ሁሉም ምርቶች" data-en="All Products">ሁሉም ምርቶች</h2>
    <div id="adminProducts"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="active" onclick="showPage('homePage',this)"><span>🏠</span><span data-am="ቤት" data-en="Home">ቤት</span></button>
  <button onclick="showPage('sellPage',this)"><span>➕</span><span data-am="ሽያጭ" data-en="Sell">ሽያጭ</span></button>
  <button onclick="showPage('favoritesPage',this)"><span>❤️</span><span data-am="የወደድኳቸው" data-en="Saved">የወደድኳቸው</span></button>
  <button onclick="showPage('cartPage',this)"><span>🛒</span><span data-am="ቅርጫት" data-en="Cart">ቅርጫት</span></button>
  <button onclick="showPage('chatPage',this)"><span>💬</span><span data-am="ውይይት" data-en="Chat">ውይይት</span></button>
  <button onclick="showPage('accountPage',this)"><span>👤</span><span data-am="መለያ" data-en="Account">መለያ</span></button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,query,where,orderBy,onSnapshot,doc,deleteDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCRQJeoRNKSIdQ0LTCHoBSUUftl2o-dUjQ",
 authDomain:"all-in-one-45d48.firebaseapp.com",
 projectId:"all-in-one-45d48",
 storageBucket:"all-in-one-45d48.firebasestorage.app",
 messagingSenderId:"1023627656415",
 appId:"1:1023627656415:web:0072d483258742a7bbfd6a"
};

const ADMIN_UID="hsmHWK8c74O4wq7GcHQnZr9JFfw1";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let productsData=[];
let selectedCategory="all";
let language=localStorage.getItem("allinone_language")||"am";
let favorites=JSON.parse(localStorage.getItem("allinone_favorites")||"[]");
let cart=JSON.parse(localStorage.getItem("allinone_cart")||"[]");
let unsubscribeMessages=null;

const $=id=>document.getElementById(id);
const isAdmin=()=>currentUser&&currentUser.uid===ADMIN_UID;
const money=value=>Number(value||0).toLocaleString();

function msg(am,en){alert(language==="am"?am:en)}
function saveLocal(){
 localStorage.setItem("allinone_favorites",JSON.stringify(favorites));
 localStorage.setItem("allinone_cart",JSON.stringify(cart));
}
window.setLanguage=function(value){
 language=value;
 localStorage.setItem("allinone_language",value);
 document.documentElement.lang=value;
 $("languageSelect").value=value;
 document.querySelectorAll("[data-am][data-en]").forEach(el=>{
  el.textContent=value==="am"?el.dataset.am:el.dataset.en;
 });
 $("searchInput").placeholder=value==="am"?"ምርት ፈልግ...":"Search products...";
 renderProducts();
 renderFavorites();
 renderCart();
};
window.showPage=function(pageId,button){
 if(pageId==="adminPage"&&!isAdmin()){msg("የአስተዳዳሪ ፈቃድ የለዎትም","Admin access only");return}
 if(["sellPage","sellerPage","ordersPage","chatPage"].includes(pageId)&&!currentUser){
  msg("እባክዎ መጀመሪያ ይግቡ","Please login first");pageId="accountPage";
 }
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 $(pageId).classList.add("active");
 document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
 if(button)button.classList.add("active");
 if(pageId==="favoritesPage")renderFavorites();
 if(pageId==="cartPage")renderCart();
 if(pageId==="sellerPage")loadSellerDashboard();
 if(pageId==="ordersPage")loadMyOrders();
 if(pageId==="chatPage")loadMessages();
 if(pageId==="adminPage")loadAdminDashboard();
};
window.setCategory=function(category,button){
 selectedCategory=category;
 document.querySelectorAll("#categoryButtons button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderProducts();
};
window.loginUser=async function(){
 const email=$("authEmail").value.trim(),password=$("authPassword").value;
 if(!email||!password)return msg("Email እና password ያስገቡ","Enter email and password");
 try{await signInWithEmailAndPassword(auth,email,password);msg("በተሳካ ሁኔታ ገብተዋል","Login successful")}
 catch(e){msg("መግባት አልተቻለም: "+e.message,"Login failed: "+e.message)}
};
window.registerUser=async function(){
 const email=$("authEmail").value.trim(),password=$("authPassword").value;
 if(!email||password.length<6)return msg("ትክክለኛ Email እና ቢያንስ 6 ፊደል ያለው password ያስገቡ","Enter valid email and password (at least 6 characters)");
 try{await createUserWithEmailAndPassword(auth,email,password);msg("መለያዎ ተፈጥሯል","Account created")}
 catch(e){msg("መለያ መፍጠር አልተቻለም: "+e.message,"Registration failed: "+e.message)}
};
window.logoutUser=async function(){
 try{await signOut(auth);msg("ወጥተዋል","Logged out");showPage("homePage")}
 catch(e){msg(e.message,e.message)}
};
onAuthStateChanged(auth,user=>{
 currentUser=user;
 $("authBox").classList.toggle("hidden",!!user);
 $("userBox").classList.toggle("hidden",!user);
 if(user){
  $("userEmail").textContent=user.email||"";
  $("userUid").textContent="UID: "+user.uid;
  if(isAdmin()){
   const adminButton=document.createElement("button");
   adminButton.textContent="🛡️ Admin";
   adminButton.onclick=()=>showPage("adminPage");
   adminButton.id="adminShortcut";
   if(!$("adminShortcut"))$("userBox").appendChild(adminButton);
  }
 }else{
  const old=$("adminShortcut");if(old)old.remove();
 }
});

async function loadProducts(){
 try{
  const snap=await getDocs(query(collection(db,"products"),orderBy("createdAt","desc")));
  productsData=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderProducts();
 }catch(e){
  console.error(e);
  $("productsGrid").innerHTML='<div class="empty">Products could not load. Check Firestore setup and rules.</div>';
 }
}
function productCard(p){
 const liked=favorites.includes(p.id);
 const image=p.imageUrl||"https://placehold.co/600x400?text=ALLIN+ONE";
 const name=escapeHtml(p.name||"Product");
 const description=escapeHtml(p.description||"");
 return `<article class="card">
  <img src="${escapeAttr(image)}" alt="${name}" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
  <div class="card-body">
   <h3>${name}</h3>
   <div class="price">${money(p.price)} ETB</div>
   <p class="muted">${description}</p>
   <p class="muted">${escapeHtml(p.sellerEmail||"")} </p>
   <div class="actions">
    <button onclick="addToCart('${p.id}')">🛒 ${language==="am"?"ጨምር":"Add"}</button>
    <button class="secondary" onclick="toggleFavorite('${p.id}')">${liked?"❤️":"🤍"}</button>
    <button class="secondary" onclick="contactSeller('${p.sellerUid||""}')">💬</button>
   </div>
  </div>
 </article>`;
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){return escapeHtml(s)}
window.renderProducts=function(){
 const term=$("searchInput").value.toLowerCase().trim();
 const list=productsData.filter(p=>{
  const matchesCategory=selectedCategory==="all"||p.category===selectedCategory;
  const matchesText=(p.name||"").toLowerCase().includes(term)||(p.description||"").toLowerCase().includes(term);
  return matchesCategory&&matchesText;
 });
 $("productsGrid").innerHTML=list.length?list.map(productCard).join(""):`<div class="empty">${language==="am"?"ምርት አልተገኘም":"No products found"}</div>`;
};
window.toggleFavorite=function(id){
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 saveLocal();renderProducts();renderFavorites();
};
function renderFavorites(){
 const list=productsData.filter(p=>favorites.includes(p.id));
 $("favoritesGrid").innerHTML=list.length?list.map(productCard).join(""):`<div class="empty">${language==="am"?"የተመረጠ ምርት የለም":"No favorites yet"}</div>`;
}
window.addToCart=function(id){
 if(!cart.includes(id))cart.push(id);
 saveLocal();renderCart();msg("ወደ ቅርጫት ተጨምሯል","Added to cart");
};
window.removeFromCart=function(id){
 cart=cart.filter(x=>x!==id);saveLocal();renderCart();
};
function renderCart(){
 const items=productsData.filter(p=>cart.includes(p.id));
 $("cartItems").innerHTML=items.length?items.map(p=>`<div class="panel">
  <b>${escapeHtml(p.name)}</b><p class="price">${money(p.price)} ETB</p>
  <button class="danger" onclick="removeFromCart('${p.id}')">${language==="am"?"አስወግድ":"Remove"}</button>
 </div>`).join(""):`<div class="empty">${language==="am"?"ቅርጫቱ ባዶ ነው":"Your cart is empty"}</div>`;
 $("cartTotal").textContent=money(items.reduce((sum,p)=>sum+Number(p.price||0),0));
}

window.publishProduct = async function () {
  if (!currentUser) {
    return msg("መጀመሪያ ይግቡ", "Please login first");
  }

  const name = $("productName").value.trim();
  const price = Number($("productPrice").value);
  const category = $("productCategory").value;
  const description = $("productDescription").value.trim();
  const phone = $("sellerPhone").value.trim();
  const file = $("productImage").files[0];
  const btn = $("publishButton");

  if (!name || !Number.isFinite(price) || price <= 0 || !file) {
    return msg(
      "ስም፣ ትክክለኛ ዋጋ እና ፎቶ ያስገቡ",
      "Enter name, valid price and image"
    );
  }

  if (file.size > 5 * 1024 * 1024) {
    return msg("ፎቶው ከ5MB መብለጥ የለበትም", "Image must be under 5MB");
  }

  let stage = "ፎቶ በመጫን ላይ";

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "Publishing...";

  try {
    // 1. Upload image to Cloudinary (using cloud name: idnxqboa and preset: ml_default)
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "ml_default");

    const cloudinaryRes = await fetch("https://api.cloudinary.com/v1_1/idnxqboa/image/upload", {
      method: "POST",
      body: formData
    });

    const cloudinaryData = await cloudinaryRes.json();
    if (!cloudinaryRes.ok) {
      throw new Error(cloudinaryData.error?.message || "Cloudinary upload failed");
    }

    const imageUrl = cloudinaryData.secure_url;

    // 2. Save product to Firestore
    stage = "ምርት ወደ Firestore በማስቀመጥ ላይ";

    await addDoc(collection(db, "products"), {
      name,
      price,
      category,
      description,
      phone,
      imageUrl,
      sellerUid: currentUser.uid,
      sellerEmail: currentUser.email || "",
      createdAt: serverTimestamp(),
      status: "active"
    });

    // 3. Clear form after successful save
    ["productName", "productPrice", "productDescription",
     "sellerPhone"].forEach(id => {
      $(id).value = "";
    });

    $("productImage").value = "";

    msg(
      "ምርቱ በተሳካ ሁኔታ ታትሟል",
      "Product published successfully"
    );

    // Refresh products separately
    try {
      await loadProducts();
      showPage("homePage");
    } catch (refreshError) {
      console.error("Product refresh error:", refreshError);
    }

  } catch (e) {
    console.error("Publish error:", stage, e);

    msg(
      stage + " ላይ ችግር ተፈጥሯል: " + (e.code || e.message),
      "Failed during " + stage + ": " + (e.code || e.message)
    );

  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
};

window.sendMessage=async function(){
 if(!currentUser)return msg("መጀመሪያ ይግቡ","Please login first");
 const toUid=$("chatRecipient").value.trim(),message=$("chatMessage").value.trim();
 if(!toUid||!message)return msg("UID እና መልዕክት ያስገቡ","Enter recipient UID and message");
 try{
  await addDoc(collection(db,"messages"),{
   fromUid:currentUser.uid,toUid,message,
   createdAt:serverTimestamp()
  });
  $("chatMessage").value="";msg("መልዕክቱ ተልኳል","Message sent");loadMessages();
 }catch(e){msg("መልዕክት መላክ አልተቻለም: "+e.message,"Message failed: "+e.message)}
};
function loadMessages(){
 if(!currentUser)return;
 if(unsubscribeMessages)unsubscribeMessages();
 const box=$("chatList");
 const q=query(collection(db,"messages"),where("toUid","==",currentUser.uid));
 unsubscribeMessages=onSnapshot(q,snap=>{
  const received=snap.docs.map(d=>({id:d.id,...d.data()}));
  box.innerHTML=received.length?received.map(m=>`<div class="panel"><b>From:</b> ${escapeHtml(m.fromUid)}<p>${escapeHtml(m.message)}</p></div>`).join(""):`<div class="empty">No messages yet</div>`;
 },err=>{box.innerHTML=`<div class="notice">${escapeHtml(err.message)}</div>`});
}
window.checkout=async function(){
 if(!currentUser)return msg("ትዕዛዝ ለማስገባት ይግቡ","Login to place an order");
 const items=productsData.filter(p=>cart.includes(p.id));
 if(!items.length)return msg("ቅርጫቱ ባዶ ነው","Your cart is empty");
 const payment=prompt(language==="am"?"የክፍያ ዘዴ ይምረጡ: Telebirr, CBE Birr, Cash":"Payment method: Telebirr, CBE Birr, Cash","Telebirr");
 if(!payment)return;
 const allowed=["telebirr","cbe birr","cash"];
 if(!allowed.includes(payment.toLowerCase().trim()))return msg("Telebirr፣ CBE Birr ወይም Cash ብቻ ይጠቀሙ","Choose Telebirr, CBE Birr or Cash");
 const total=items.reduce((s,p)=>s+Number(p.price||0),0);
 const reference=prompt(language==="am"?"የክፍያ ማረጋገጫ ቁጥር (ካለ)":"Payment reference (if available)","")||"";
 try{
  await addDoc(collection(db,"orders"),{
   buyerUid:currentUser.uid,buyerEmail:currentUser.email||"",
   items:items.map(p=>({productId:p.id,name:p.name,price:Number(p.price),sellerUid:p.sellerUid||""})),
   total,paymentMethod:payment,paymentReference:reference,
   paymentStatus:"pending",status:"pending",createdAt:serverTimestamp()
  });
  cart=[];saveLocal();renderCart();
  msg("ትዕዛዝዎ ተመዝግቧል። ክፍያው እስኪረጋገጥ ይጠብቁ።","Order submitted. Payment is pending verification.");
 }catch(e){msg("ትዕዛዝ መመዝገብ አልተቻለም: "+e.message,"Order failed: "+e.message)}
};
async function loadSellerDashboard(){
 if(!currentUser)return;
 $("sellerProducts").innerHTML="Loading...";
 try{
  const snap=await getDocs(query(collection(db,"products"),where("sellerUid","==",currentUser.uid)));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("sellerProducts").innerHTML=rows.length?rows.map(p=>`<div class="panel"><b>${escapeHtml(p.name)}</b> — ${money(p.price)} ETB
   <button class="danger" onclick="deleteOwnProduct('${p.id}')">Delete</button></div>`).join(""):"<div class='empty'>No products</div>";
  const orderSnap=await getDocs(collection(db,"orders"));
  const orders=orderSnap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>(o.items||[]).some(i=>i.sellerUid===currentUser.uid));
  $("sellerOrders").innerHTML=orders.length?orders.map(o=>`<div class="panel"><b>Order:</b> ${escapeHtml(o.id)}<p>${money(o.total)} ETB — ${escapeHtml(o.status||"pending")}</p></div>`).join(""):"<div class='empty'>No orders</div>";
 }catch(e){$("sellerProducts").textContent=e.message}
}
window.deleteOwnProduct=async function(id){
 if(!currentUser||!confirm("Delete this product?"))return;
 try{
  const p=productsData.find(x=>x.id===id);
  if(p&&p.sellerUid!==currentUser.uid)throw new Error("Not your product");
  await deleteDoc(doc(db,"products",id));await loadProducts();loadSellerDashboard();
 }catch(e){msg(e.message,e.message)}
};
async function loadMyOrders(){
 if(!currentUser)return;
 $("myOrders").innerHTML="Loading...";
 try{
  const snap=await getDocs(query(collection(db,"orders"),where("buyerUid","==",currentUser.uid)));

$("myOrders").innerHTML=rows.length

async function loadAdminDashboard(){
 if(!isAdmin()){
  msg("Admin only","Admin access only");
  return;
 }

 $("adminOrders").innerHTML="Loading orders...";

 try{
  const orderSnap=await getDocs(
   query(collection(db,"orders"),orderBy("createdAt","desc"))
  );

  const orders=orderSnap.docs
 .map(d=>({id:d.id,...d.data()}))
 .filter(o=>o.status!=="cancelled");

  $("adminOrders").innerHTML=orders.length
   ?orders.map(o=>`
    <div class="panel">
     <b>Order:</b> ${escapeHtml(o.id)}
     <p>Buyer: ${escapeHtml(o.buyerEmail||"")}</p>
     <p>Total: ${money(o.total)} ETB</p>
     <p>Payment: ${escapeHtml(o.paymentMethod||"")} / ${escapeHtml(o.paymentReference||"")}</p>
     <p>Payment Status: <b>${escapeHtml(o.paymentStatus||"pending")}</b></p>
     <p>Order Status: <b>${escapeHtml(o.status||"pending")}</b></p>

     <div class="actions">
      <button
       onclick="updateOrderStatus('${o.id}','verify')">
       Verify Payment
      </button>

      <button class="secondary"
       onclick="updateOrderStatus('${o.id}','complete')">
       Complete
      </button>

      <button class="danger"
       onclick="updateOrderStatus('${o.id}','cancel')">
       Cancel
      </button>
     </div>
    </div>
   `).join("")
   :'<div class="empty">No orders</div>';

  const productSnap=await getDocs(collection(db,"products"));
  const products=productSnap.docs.map(d=>({
   id:d.id,...d.data()
  }));

  $("adminProducts").innerHTML=products.length
   ?products.map(p=>`
    <div class="panel">
     <b>${escapeHtml(p.name)}</b> — ${money(p.price)} ETB
     <button class="danger"
      onclick="adminDeleteProduct('${p.id}')">
      Delete
     </button>
    </div>
   `).join("")
   :'<div class="empty">No products</div>';

 }catch(e){
  console.error("Admin dashboard error:",e);
  $("adminOrders").innerHTML=
   `<div class="notice">${escapeHtml(e.message)}</div>`;
 }
}

window.updateOrderStatus=async function(id,action){

 if(!isAdmin()){
  return msg("Admin only","Admin access only");
 }

 if(action==="cancel"){
  if(!confirm("ይህን ትዕዛዝ መሰረዝ ይፈልጋሉ?")){
   return;
  }
 }

 let changes={};

 if(action==="verify"){
  changes={
   paymentStatus:"verified",
   updatedAt:serverTimestamp()
  };
 }
 else if(action==="complete"){
  changes={
   status:"completed",
   updatedAt:serverTimestamp()
  };
 }
 else if(action==="cancel"){
  changes={
   status:"cancelled",
   updatedAt:serverTimestamp()
  };
 }
 else{
  return;
 }

 try{

  await updateDoc(doc(db,"orders",id),changes);

  await loadAdminDashboard();

  msg(
   action==="cancel"?
   "ትዕዛዙ ተሰርዟል":
   "ትዕዛዙ ተሻሽሏል",
   action==="cancel"?
   "Order cancelled successfully":
   "Order updated successfully"
  );

 }catch(e){
  console.error(e);
  msg("ስህተት: "+e.message,"Error: "+e.message);
 }
};

 window.adminDeleteProduct=async function(id){
 if(!isAdmin())return;

 if(!confirm("Delete this product?"))return;

 try{
  await deleteDoc(doc(db,"products",id));
  await loadProducts();
  await loadAdminDashboard();
 }catch(e){
  msg(e.message,e.message);
 }
};
