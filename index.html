
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b55">
<meta name="description" content="ALLIN ONE - Buy, Sell and Connect">
<title>ALLIN ONE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--green:#087b55;
--dark:#005b42;
--light:#e8f7ef;
--bg:#f5f7f6;
--text:#17251e;
--muted:#718078;
--border:#e5ebe7;
}
body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
padding-bottom:85px;
overflow-x:hidden;
}
button,input,textarea,select{font:inherit}
button{
border:0;border-radius:9px;padding:11px 15px;
background:var(--green);color:white;
font-weight:600;cursor:pointer;
}
button:disabled{opacity:.5}
button.secondary{background:#e8f2ed;color:var(--green)}
button.danger{background:#ffe8e8;color:#bd2929}
header{
background:white;padding:14px;
position:sticky;top:0;z-index:50;
box-shadow:0 2px 10px #0000000c;
}
.top{
display:flex;justify-content:space-between;
align-items:center;gap:10px;flex-wrap:wrap;
max-width:1200px;margin:auto;
}
.logo{font-size:24px;font-weight:800;color:var(--green)}
#languageSelect{
padding:10px;border:1px solid var(--border);
border-radius:8px;background:white;
}
.search-area{
display:flex;gap:8px;
max-width:1200px;margin:14px auto 0;
}
.search-area input{flex:1}
input,textarea,select{
width:100%;min-width:0;padding:12px;
border:1px solid #dce5df;border-radius:9px;
background:white;outline:none;
}
input:focus,textarea:focus,select:focus{
border-color:var(--green);
box-shadow:0 0 0 3px #087b5515;
}
main{max-width:1200px;margin:auto;padding:14px}
.page{display:none}
.page.active{display:block}
.page h2{font-size:24px;margin:20px 0}
.categories{
display:flex;gap:9px;overflow-x:auto;
padding:12px 0;scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.categories button{
white-space:nowrap;background:white;
color:#34443b;border:1px solid var(--border);
}
.categories button.active{
background:var(--green);color:white;
}
.grid{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:16px;
}
.card{
background:white;border:1px solid var(--border);
border-radius:13px;overflow:hidden;
box-shadow:0 3px 12px #00000008;
min-width:0;
}
.card>img{
width:100%;height:190px;display:block;
object-fit:cover;background:#f0f2f0;
cursor:pointer;
}
.card-body{padding:13px}
.card-body h3{
font-size:16px;margin-bottom:9px;
cursor:pointer;overflow-wrap:anywhere;
}
.price{
color:var(--green);font-weight:800;
font-size:18px;margin:8px 0;
}
.muted{
font-size:12px;color:var(--muted);
margin:7px 0;overflow-wrap:anywhere;
}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button,.actions a{
flex:1;text-align:center;font-size:12px;
padding:10px 7px;
}
.call-button{
display:inline-block;text-decoration:none;
background:#e8f7ef;color:var(--green);
border-radius:8px;font-weight:bold;
}
.form-box,.panel{
background:white;border:1px solid var(--border);
padding:17px;border-radius:13px;margin:12px 0;
box-shadow:0 2px 9px #00000008;
}
.form-box label{
display:block;font-size:14px;
font-weight:600;margin:13px 0 6px;
}
.form-box textarea{min-height:100px;resize:vertical}
.form-box button{margin-top:13px}
.row{display:flex;gap:10px}
.row button{flex:1}
.hidden{display:none!important}
.empty{
background:white;padding:30px 15px;
border-radius:12px;color:var(--muted);
text-align:center;grid-column:1/-1;
}
.fee-line{
display:flex;justify-content:space-between;
gap:10px;padding:10px 0;font-size:14px;
}
.fee-total{font-size:18px;font-weight:bold;color:var(--green)}
.chat-window{
background:white;border-radius:12px;
overflow:hidden;border:1px solid var(--border);
margin-top:15px;
}
.chat-header{
padding:15px;background:var(--green);
color:white;font-weight:bold;
}
.chat-thread{
min-height:260px;max-height:400px;
overflow-y:auto;padding:14px;
}
.chat-bubble{
max-width:80%;padding:11px;
border-radius:12px;margin:9px 0;
overflow-wrap:anywhere;
}
.chat-sent{background:#dff5e8;margin-left:auto}
.chat-received{background:#f0f2f0}
.chat-time{font-size:10px;color:#718078;margin-top:6px}
.chat-compose{
display:flex;gap:8px;padding:10px;
border-top:1px solid var(--border);
}
.chat-compose textarea{resize:none;min-height:45px}
.chat-item{
padding:13px;border-bottom:1px solid var(--border);
cursor:pointer;
}
.chat-item.active{background:var(--light)}
.chat-user{font-weight:bold}
.chat-preview{font-size:12px;color:var(--muted);margin-top:5px}
.user-top-section{overflow-wrap:anywhere}
.user-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.logout-container{margin-top:15px}
.modal{
display:none;position:fixed;inset:0;z-index:100;
background:#000b;padding:15px;overflow-y:auto;
}
.modal.open{
display:flex;align-items:center;justify-content:center;
}
.modal-box{
width:100%;max-width:550px;
background:white;border-radius:15px;
overflow:hidden;position:relative;
}
.modal-close{
position:absolute;right:10px;top:10px;
z-index:2;background:#ffffffed;color:#222;
border-radius:50%;
}
.zoom-wrap{overflow:hidden;background:#f1f1f1}
.zoom-wrap img{
width:100%;max-height:350px;
object-fit:contain;display:block;
}
.zoom-wrap img.zoomed{transform:scale(1.8)}
.modal-content{padding:17px}
.bottom-nav{
position:fixed;bottom:0;left:0;right:0;
height:68px;background:white;
border-top:1px solid var(--border);
display:flex;justify-content:space-around;
align-items:center;z-index:80;
padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
background:transparent;color:#77847c;
padding:7px 5px;flex:1;border-radius:0;
display:flex;flex-direction:column;
align-items:center;gap:3px;font-size:11px;
}
.bottom-nav button span:first-child{font-size:20px}
.bottom-nav button.active{
color:var(--green);background:var(--light);
}
.notice{
padding:12px;background:#fff1ce;
border-radius:8px;color:#805800;
}

/* ADMIN DASHBOARD */
#adminPage{max-width:1200px;margin:auto}
.admin-header{
background:linear-gradient(120deg,#005b42,#00a65a);
color:white;padding:25px;border-radius:15px;margin:12px 0;
}
.admin-header h2{color:white;font-size:25px}
.admin-header p{margin-top:8px}
.admin-menu{
display:flex;gap:8px;overflow-x:auto;padding:12px 0;
}
.admin-menu button{white-space:nowrap}
.admin-stats{
display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
gap:12px;margin:12px 0;
}
.admin-stat{
background:white;padding:18px;border-radius:13px;
box-shadow:0 2px 9px #00000010;
border:1px solid var(--border);
}
.admin-stat .stat-icon{font-size:27px}
.admin-stat h3{font-size:25px;margin:9px 0;color:#10233f}
.admin-stat p{color:#666;font-size:13px}
.admin-stat small{color:#078747;font-weight:bold}
.admin-content{
background:white;padding:16px;border-radius:13px;
margin:12px 0;box-shadow:0 2px 9px #0000000c;
overflow-x:auto;
}
.admin-content h3{color:#10233f;margin-bottom:14px}
.admin-badge{
display:inline-block;padding:5px 10px;
border-radius:20px;background:#d9f6e6;
color:#087b55;font-size:12px;font-weight:bold;
}
.admin-badge.pending{background:#fff1ce;color:#986500}
.admin-badge.cancelled{background:#ffe0e0;color:#b32626}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap}
.admin-actions button{font-size:11px;padding:8px}
.admin-chart{
height:150px;display:flex;align-items:end;
gap:12px;padding:15px 5px 0;
border-bottom:1px solid #ddd;
}
.admin-bar{
flex:1;min-width:12px;
background:linear-gradient(#00b968,#087b55);
border-radius:7px 7px 0 0;position:relative;
}
.admin-bar span{
position:absolute;bottom:-23px;left:50%;
transform:translateX(-50%);
font-size:10px;color:#777;
}
.admin-shortcut{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;margin:12px 0;
}
.admin-shortcut button{padding:18px 8px;font-size:14px}

@media(max-width:900px){
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
main{padding:10px}
.logo{font-size:21px}
.page h2{font-size:21px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card>img{height:155px}
.card-body{padding:10px}
.card-body h3{font-size:14px}
.card .price{font-size:16px}
.actions{gap:5px}
.actions button,.actions a{font-size:11px}
.admin-header{padding:18px}
.admin-header h2{font-size:20px}
.admin-stat{padding:13px}
.admin-stat h3{font-size:21px}
.row{flex-wrap:wrap}
}
@media(max-width:350px){
.grid{grid-template-columns:1fr}
.card>img{height:210px}
}
</style>
</head>
