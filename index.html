
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN ONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#172033}
header{background:#123b75;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
header h1{margin:0}
header p{color:#dbeafe}
.container{padding:20px 15px;max-width:500px;margin:auto}
.card{background:white;padding:22px;border-radius:16px;margin:15px 0;box-shadow:0 2px 10px #0001}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
button{background:#1765bd;color:white;border:0;padding:13px 18px;border-radius:9px;font-size:15px;cursor:pointer}
.full{width:100%;margin-top:10px}
.link{color:#1765bd;background:none;padding:8px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:white;padding:18px 8px;text-align:center;border-radius:14px;box-shadow:0 2px 8px #0001}
.item span{font-size:30px}
.item h3{font-size:15px}
.item p{font-size:12px;color:#64748b}
.language{text-align:center;padding:15px}
#app{padding-bottom:30px}
</style>
</head>
<body>

<header>
<h1>🌍 ALL IN ONE</h1>
<p id="headerText">ሁሉም አገልግሎቶች በአንድ ቦታ!</p>
</header>

<div class="language">
<button onclick="setLanguage('am')">አማርኛ</button>
<button onclick="setLanguage('en')">English</button>
</div>

<div class="container">
<section id="auth">
<div class="card">
<h2 id="formTitle">አካውንት ፍጠር</h2>
<div id="nameBox">
<input id="name" placeholder="ሙሉ ስም">
</div>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="full" onclick="submitAuth()" id="submitBtn">Sign Up</button>
<p style="text-align:center">
<span id="switchText">አካውንት አለህ?</span>
<button class="link" onclick="switchAuth()" id="switchBtn">Login</button>
</p>
<p id="message"></p>
</div>
</section>

<section id="app" class="hidden">
<h2 id="welcome">እንኳን ደህና መጡ!</h2>
<input id="search" placeholder="🔍 አገልግሎት ፈልግ...">
<h3 id="servicesTitle">ዋና አገልግሎቶች</h3>

<div class="grid" id="services">
<div class="item" onclick="service(0)"><span>🛒</span><h3>ገበያ</h3><p>ግዢና ሽያጭ</p></div>
<div class="item" onclick="service(1)"><span>💬</span><h3>ውይይት</h3><p>መልዕክት</p></div>
<div class="item" onclick="service(2)"><span>💳</span><h3>ክፍያ</h3><p>የክፍያ አገልግሎት</p></div>
<div class="item" onclick="service(3)"><span>🚚</span><h3>ዕቃ ማድረስ</h3><p>ዕቃ ማድረስ</p></div>
<div class="item" onclick="service(4)"><span>💼</span><h3>ሥራ</h3><p>የሥራ ፍለጋ</p></div>
<div class="item" onclick="service(5)"><span>🏠</span><h3>ቤትና መሬት</h3><p>ኪራይና ሽያጭ</p></div>
<div class="item" onclick="service(6)"><span>🚕</span><h3>ትራንስፖርት</h3><p>መጓጓዣ</p></div>
<div class="item" onclick="service(7)"><span>👤</span><h3>መለያዬ</h3><p>የግል መረጃ</p></div>
</div>

<div class="card" id="result">ALL IN ONE እንኳን ደህና መጡ!</div>
<button class="full" onclick="logout()" id="logoutBtn">ውጣ</button>
</section>
</div>

<script>
let isSignup=true;
let currentLanguage=localStorage.getItem('language')||'am';
let loggedInName='';

const translations={
am:{
header:'ሁሉም አገልግሎቶች በአንድ ቦታ!',
create:'አካውንት ፍጠር',
loginTitle:'ወደ አካውንትህ ግባ',
fullName:'ሙሉ ስም',
signup:'Sign Up',
login:'Login',
have:'አካውንት አለህ?',
noHave:'አካውንት የለህም?',
welcome:'እንኳን ደህና መጣህ',
search:'🔍 አገልግሎት ፈልግ...',
services:'ዋና አገልግሎቶች',
names:['ገበያ','ውይይት','ክፍያ','ዕቃ ማድረስ','ሥራ','ቤትና መሬት','ትራንስፖርት','መለያዬ'],
desc:['ግዢና ሽያጭ','መልዕክት','የክፍያ አገልግሎት','ዕቃ ማድረስ','የሥራ ፍለጋ','ኪራይና ሽያጭ','መጓጓዣ','የግል መረጃ'],
logout:'ውጣ',
result:'ይህ አገልግሎት በልማት ላይ ነው።',
fill:'እባክህ ሁሉንም ቦታ ሙላ።',
passError:'Password ቢያንስ 6 ፊደል ይሁን።'
},
en:{
header:'All services in one place!',
create:'Create Account',
loginTitle:'Login to Your Account',
fullName:'Full Name',
signup:'Sign Up',
login:'Login',
have:'Already have an account?',
noHave:"Don't have an account?",
welcome:'Welcome',
search:'🔍 Search services...',
services:'Main Services',
names:['Market','Chat','Payment','Delivery','Jobs','House & Land','Transport','My Account'],
desc:['Buy and Sell','Messages','Payment Services','Deliver Items','Find Jobs','Rent and Sell','Transportation','Personal Information'],
logout:'Logout',
result:'This service is under development.',
fill:'Please fill in all fields.',
passError:'Password must be at least 6 characters.'
}
};

function setLanguage(lang){
if(!translations[lang])return;
currentLanguage=lang;
localStorage.setItem('language',lang);
document.documentElement.lang=lang;
const t=translations[lang];

document.getElementById('headerText').innerText=t.header;
document.getElementById('formTitle').innerText=isSignup?t.create:t.loginTitle;
document.getElementById('name').placeholder=t.fullName;
document.getElementById('submitBtn').innerText=isSignup?t.signup:t.login;
document.getElementById('switchText').innerText=isSignup?t.have:t.noHave;
document.getElementById('switchBtn').innerText=isSignup?t.login:t.signup;
document.getElementById('search').placeholder=t.search;
document.getElementById('servicesTitle').innerText=t.services;
document.getElementById('logoutBtn').innerText=t.logout;

document.querySelectorAll('.item').forEach((item,i)=>{
item.querySelector('h3').innerText=t.names[i];
item.querySelector('p').innerText=t.desc[i];
});

if(loggedInName){
document.getElementById('welcome').innerText=t.welcome+' '+loggedInName+'!';
}
}

function switchAuth(){
isSignup=!isSignup;
document.getElementById('nameBox').classList.toggle('hidden',!isSignup);
document.getElementById('message').innerText='';
setLanguage(currentLanguage);
}

function submitAuth(){
const name=document.getElementById('name').value.trim();
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const t=translations[currentLanguage];

if(!email||!password||(isSignup&&!name)){
document.getElementById('message').innerText=t.fill;
return;
}
if(password.length<6){
document.getElementById('message').innerText=t.passError;
return;
}
loggedInName=isSignup?name:email.split('@')[0];
document.getElementById('auth').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
setLanguage(currentLanguage);
}

function logout(){
document.getElementById('app').classList.add('hidden');
document.getElementById('auth').classList.remove('hidden');
document.getElementById('email').value='';
document.getElementById('password').value='';
document.getElementById('name').value='';
loggedInName='';
isSignup=false;
switchAuth();
}

function service(index){
document.getElementById('result').innerHTML=
'<h3>'+translations[currentLanguage].names[index]+'</h3><p>'+
translations[currentLanguage].result+'</p>';
}

document.getElementById('search').addEventListener('input',function(){
const q=this.value.toLowerCase();
document.querySelectorAll('.item').forEach(item=>{
item.style.display=item.innerText.toLowerCase().includes(q)?'':'none';
});
});

setLanguage(currentLanguage);
</script>

</body>
</html>
