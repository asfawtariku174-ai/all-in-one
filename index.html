
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN ONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#172033}
header{background:#123b75;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
header h1{margin:0}
header p{color:#dbeafe}
.container{padding:20px 15px;max-width:500px;margin:auto}
.card{background:white;padding:22px;border-radius:16px;margin:15px 0;box-shadow:0 2px 10px #0001}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
button{background:#1765bd;color:white;border:0;padding:13px 18px;border-radius:9px;font-size:15px;cursor:pointer}
.full{width:100%;margin-top:10px}
.link{color:#1765bd;background:none;padding:8px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:white;padding:18px 8px;text-align:center;border-radius:14px;box-shadow:0 2px 8px #0001}
.item span{font-size:30px}
.item h3{font-size:15px}
.item p{font-size:12px;color:#64748b}
footer{position:fixed;bottom:0;left:0;width:100%;background:white;padding:10px;display:flex;justify-content:space-around;box-shadow:0 -2px 10px #0001}
footer button{background:none;color:#123b75;font-size:12px;padding:8px}
#app{padding-bottom:75px}
</style>
</head>
<body>

<header>
<h1>🌍 ALL IN ONE</h1>
<p>ሁሉም አገልግሎቶች በአንድ ቦታ!</p>
</header>

<div class="container">

<section id="auth">
<div class="card">
<h2 id="formTitle">አካውንት ፍጠር</h2>

<div id="nameBox">
<input id="name" placeholder="ሙሉ ስም">
</div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="full" onclick="submitAuth()" id="submitBtn">Sign Up</button>

<p style="text-align:center">
<span id="switchText">አካውንት አለህ?</span>
<button class="link" onclick="switchAuth()" id="switchBtn">Login</button>
</p>
<p id="message"></p>
</div>
</section>

<section id="app" class="hidden">
<div class="container">
<h2 id="welcome">እንኳን ደህና መጡ!</h2>
<input id="search" placeholder="🔍 አገልግሎት ፈልግ...">

<h3>ዋና አገልግሎቶች</h3>
<div class="grid" id="services">

<div class="item" onclick="service('ገበያ')">
<span>🛒</span><h3>ገበያ</h3><p>ግዢና ሽያጭ</p>
</div>

<div class="item" onclick="service('ውይይት')">
<span>💬</span><h3>ውይይት</h3><p>መልዕክት</p>
</div>

<div class="item" onclick="service('ክፍያ')">
<span>💳</span><h3>ክፍያ</h3><p>የክፍያ አገልግሎት</p>
</div>

<div class="item" onclick="service('ዕቃ ማድረስ')">
<span>🚚</span><h3>ዕቃ ማድረስ</h3><p>Delivery</p>
</div>

<div class="item" onclick="service('ሥራ')">
<span>💼</span><h3>ሥራ</h3><p>የሥራ ፍለጋ</p>
</div>

<div class="item" onclick="service('ቤትና መሬት')">
<span>🏠</span><h3>ቤትና መሬት</h3><p>ኪራይና ሽያጭ</p>
</div>

<div class="item" onclick="service('ትራንስፖርት')">
<span>🚕</span><h3>ትራንስፖርት</h3><p>መጓጓዣ</p>
</div>

<div class="item" onclick="service('መለያዬ')">
<span>👤</span><h3>መለያዬ</h3><p>የግል መረጃ</p>
</div>

</div>
<div class="card" id="result">
ALL IN ONE እንኳን ደህና መጡ!
</div>
<button class="full" onclick="logout()">Logout / ውጣ</button>
</div>
</section>

</div>

<script>
let isSignup=true;

function switchAuth(){
isSignup=!isSignup;
document.getElementById('formTitle').innerText=
isSignup?'አካውንት ፍጠር':'ወደ አካውንትህ ግባ';
document.getElementById('submitBtn').innerText=
isSignup?'Sign Up':'Login';
document.getElementById('nameBox').classList.toggle('hidden',!isSignup);
document.getElementById('switchText').innerText=
isSignup?'አካውንት አለህ?':'አካውንት የለህም?';
document.getElementById('switchBtn').innerText=
isSignup?'Login':'Sign Up';
document.getElementById('message').innerText='';
}

function submitAuth(){
let name=document.getElementById('name').value.trim();
let email=document.getElementById('email').value.trim();
let password=document.getElementById('password').value;

if(!email||!password||(isSignup&&!name)){
document.getElementById('message').innerText='እባክህ ሁሉንም ቦታ ሙላ።';
return;
}
if(password.length<6){
document.getElementById('message').innerText='Password ቢያንስ 6 ፊደል ይሁን።';
return;
}
let userName=isSignup?name:email.split('@')[0];
showApp(userName);
}

function showApp(name){
document.getElementById('auth').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
document.getElementById('welcome').innerText='እንኳን ደህና መጣህ '+name+'!';
}

function logout(){
document.getElementById('app').classList.add('hidden');
document.getElementById('auth').classList.remove('hidden');
document.getElementById('email').value='';
document.getElementById('password').value='';
document.getElementById('name').value='';
isSignup=false;
switchAuth();
}

function service(name){
document.getElementById('result').innerHTML=
'<h3>'+name+'</h3><p>ይህ አገልግሎት በልማት ላይ ነው።</p>';
}

document.getElementById('search').addEventListener('input',function(){
let q=this.value.toLowerCase();
document.querySelectorAll('.item').forEach(item=>{
item.style.display=item.innerText.toLowerCase().includes(q)?'':'none';
});
});
</script>
</body>
</html>
