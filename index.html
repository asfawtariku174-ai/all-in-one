<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All in One - መተግበሪያ</title>
    <!-- FontAwesome ለاይኮኖች -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
            padding-bottom: 70px; /* የታችኛው ናቪጌሽን እንዳይጋርደው */
        }
        /* የላይኛው አረንጓዴ ከለር ክፍል */
        .header-section {
            background-color: #008751;
            padding: 15px;
            color: white;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .lang-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .search-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .search-container h2 {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .search-box-wrapper {
            display: flex;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            padding: 4px;
        }
        .location-select {
            border: none;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            margin-right: 5px;
            font-size: 14px;
            outline: none;
        }
        .search-input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }
        .search-btn {
            background: none;
            border: none;
            padding: 0 12px;
            cursor: pointer;
            color: #008751;
            font-size: 16px;
        }

        /* ፈጣን አዝራሮች (Quick Pills) */
        .quick-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 15px;
            background: white;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .quick-pills::-webkit-scrollbar {
            display: none;
        }
        .pill {
            background: #f0f4f1;
            border: 1px solid #dcdcdc;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            color: #008751;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        /* ዋና ዋና ክፍሎች (Categories Grid) */
        .container {
            padding: 15px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #222;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .cat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #333;
            padding: 8px 4px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .cat-card:active {
            background: #f0f0f0;
        }
        .cat-icon {
            width: 50px;
            height: 50px;
            background: #f0f4f1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .cat-card span {
            font-size: 12px;
            line-height: 1.2;
        }

        /* የታችኛው ናቪጌሽን (Bottom Navigation Bar) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #777;
            font-size: 11px;
        }
        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #008751;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- የላይኛው አረንጓዴ ክፍል እና መፈለጊያ -->
    <div class="header-section">
        <div class="top-bar">
            <button class="lang-btn"><i class="fa-solid fa-globe"></i> English / አማርኛ</button>
        </div>
        <div class="search-container">
            <h2>ምን ይፈልጋሉ?</h2>
            <div class="search-box-wrapper">
                <select class="location-select">
                    <option>ኢትዮጵያ</option>
                    <option>አዲስ አበባ</option>
                </select>
                <input type="text" class="search-input" placeholder="እቃዎችን ወይም አገልግሎቶችን ይፈልጉ...">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </div>

    <!-- ፈጣን መረጣዎች -->
    <div class="quick-pills">
        <a href="#" class="pill"><i class="fa-solid fa-bullseye"></i> ንቁ መረጃዎች</a>
        <a href="#" class="pill"><i class="fa-solid fa-store"></i> እንዴት መሸጥ ይቻላል?</a>
        <a href="#" class="pill"><i class="fa-solid fa-gamepad"></i> ጨዋታዎች</a>
    </div>

    <!-- ዋና ዋና አገልግሎቶች (ማትሪክስ/ግሪድ) -->
    <div class="container">
        <div class="section-title">ዋና አገልግሎቶች</div>
        <div class="categories-grid">
            <a href="#" class="cat-card">
                <div class="cat-icon">🛒</div>
                <span>ገበያ</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">💬</div>
                <span>ውይይት</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">💳</div>
                <span>ክፍያ</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">🚚</div>
                <span>ዕቃ ማድረስ</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">💼</div>
                <span>ሥራ</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">🏠</div>
                <span>ቤትና መሬት</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">🚕</div>
                <span>ትራንስፖርት</span>
            </a>
            <a href="#" class="cat-card">
                <div class="cat-icon">👤</div>
                <span>መለያዬ</span>
            </a>
        </div>
    </div>

    <!-- የታችኛው ናቪጌሽን ባር -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-bookmark"></i>
            <span>Saved</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-square-plus" style="font-size: 22px; color: #008751;"></i>
            <span>Sell</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-comment-dots"></i>
            <span>Messages</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

</body>
</html>
