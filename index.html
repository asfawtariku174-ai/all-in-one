
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN ONE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f3f5fa;color:#172033;
}
header{
 background:#123b75;color:white;
 padding:25px 18px;border-radius:0 0 25px 25px;
}
header h1{margin:0;font-size:28px}
header p{margin-bottom:0;color:#dbeafe}
.search{
 margin:20px 15px;background:white;
 padding:14px;border-radius:12px;
}
.search input{
 border:0;outline:0;width:100%;font-size:16px;
}
h2{margin:20px 15px;font-size:20px}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;padding:0 15px;
}
.item{
 background:white;padding:20px 10px;
 border-radius:15px;text-align:center;
 box-shadow:0 2px 8px #00000010;
}
.item span{font-size:30px}
.item h3{font-size:15px;margin-bottom:5px}
.item p{font-size:12px;color:#64748b}
button{
 background:#1765bd;color:white;border:0;
 padding:12px 20px;border-radius:10px;
}
footer{
 position:fixed;bottom:0;left:0;width:100%;
 background:white;display:flex;
 justify-content:space-around;padding:12px 3px;
 box-shadow:0 -2px 10px #00000012;
}
footer button{padding:10px;background:transparent;
 color:#123b75;font-size:12px}
main{padding-bottom:90px}
</style>
</head>
<body>
<header>
<h1>🌍 ALL IN ONE</h1>
<p>Your services, all in one place.</p>
</header>

<div class="search">
<input id="search" placeholder="🔍 Search anything...">
</div>

<h2>Welcome to ALL IN ONE</h2>
<h2>Our Services</h2>

<div class="grid" id="services">
<div class="item"><span>🛒</span><h3>Marketplace</h3><p>Buy and Sell</p></div>
<div class="item"><span>💬</span><h3>Chat</h3><p>Send Messages</p></div>
<div class="item"><span>💳</span><h3>Payment</h3><p>Payment Services</p></div>
<div class="item"><span>🚚</span><h3>Delivery</h3><p>Get Your Products</p></div>
<div class="item"><span>👤</span><h3>My Account</h3><p>Your Profile</p></div>
<div class="item"><span>⚙️</span><h3>Settings</h3><p>Manage App</p></div>
</div>

<footer>
<button onclick="home()">🏠 Home</button>
<button onclick="alert('Marketplace coming soon!')">🛒 Shop</button>
<button onclick="alert('Chat coming soon!')">💬 Chat</button>
<button onclick="alert('Account coming soon!')">👤 Account</button>
</footer>

<script>
function home(){
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('search').addEventListener('input',function(){
 let q=this.value.toLowerCase();
 document.querySelectorAll('.item').forEach(item=>{
 item.style.display=item.innerText.toLowerCase().includes(q)
 ? '' : 'none';
 });
});
</script>
</body>
</html>
