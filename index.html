
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b75">
<title>ALL IN ONE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f1f5f9;color:#172033
}
header{
 background:#123b75;color:white;
 padding:28px 20px;border-radius:0 0 25px 25px
}
header h1{margin:0;font-size:30px}
header p{color:#dbeafe}
.container{max-width:650px;margin:auto;padding:15px}
.card{
 background:white;padding:20px;border-radius:17px;
 margin:13px 0;box-shadow:0 2px 9px #0001
}
input,textarea{
 width:100%;padding:14px;margin:8px 0;
 border:1px solid #ddd;border-radius:12px;
 font-size:16px;background:white;color:#172033
}
textarea{min-height:100px;resize:vertical}
button{
 border:0;border-radius:10px;padding:13px 17px;
 background:#1765bd;color:white;font-size:16px;
 cursor:pointer
}
button:disabled{opacity:.5}
.full{width:100%;margin-top:8px}
.link{background:none;color:#1765bd}
.hidden{display:none!important}
.grid{
 display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.item{
 background:white;padding:17px 7px;text-align:center;
 border-radius:15px;box-shadow:0 2px 8px #0001;
 cursor:pointer
}
.item span{font-size:30px}
.item h3{font-size:15px}
.item p{font-size:12px;color:#64748b}
.post{border-bottom:1px solid #eee;padding:12px 0}
.small{font-size:12px;color:#64748b}
#message{color:#b91c1c;overflow-wrap:anywhere}
.language{text-align:center;padding:15px}
.status{color:#087443}
</style>
</head>

<body>

<header>
<h1>🌍 ALL IN ONE</h1>
<p id="headerText">ሁሉም አገልግሎቶች በአንድ ቦታ!</p>
</header>

<div class="language">
<button onclick="setLanguage('am')">አማርኛ</button>
<button onclick="setLanguage('en')">English</button>
</div>

<div class="container">

<!-- LOGIN / SIGN UP -->
<section id="auth">
<div class="card">
<h2 id="authTitle">ወደ አካውንትህ ግባ</h2>

<div id="nameBox" class="hidden">
<input id="name" autocomplete="name" placeholder="ሙሉ ስም">
</div>

<input id="email" type="email"
autocomplete="email" placeholder="Email">

<input id="password" type="password"
autocomplete="current-password" placeholder="Password">

<button class="full" id="authButton"
onclick="submitAuth()">Login</button>

<p style="text-align:center">
<span id="switchText">አካውንት የለህም?</span>
<button class="link" onclick="switchAuth()" id="switchButton">
Sign Up
</button>
</p>

<p id="message" role="alert"></p>
</div>
</section>

<!-- MAIN APP -->
<section id="app" class="hidden">

<div class="card">
<h2 id="welcome">እንኳን ደህና መጡ!</h2>
<p id="userEmail" class="small"></p>
<input id="search" placeholder="🔍 አገልግሎት ፈልግ...">
</div>

<h3 id="serviceTitle">ዋና አገልግሎቶች</h3>

<div class="grid" id="services">

<div class="item" onclick="openService('market')">
<span>🛒</span><h3>ገበያ</h3><p>ግዢና ሽያጭ</p>
</div>

<div class="item" onclick="openService('chat')">
<span>💬</span><h3>ውይይት</h3><p>መልዕክት</p>
</div>

<div class="item" onclick="openService('payment')">
<span>💳</span><h3>ክፍያ</h3><p>የክፍያ ጥያቄ</p>
</div>

<div class="item" onclick="openService('delivery')">
<span>🚚</span><h3>ዕቃ ማድረስ</h3><p>የማድረስ ጥያቄ</p>
</div>

<div class="item" onclick="openService('jobs')">
<span>💼</span><h3>ሥራ</h3><p>የሥራ ፍለጋ</p>
</div>

<div class="item" onclick="openService('house')">
<span>🏠</span><h3>ቤትና መሬት</h3><p>ኪራይና ሽያጭ</p>
</div>

<div class="item" onclick="openService('transport')">
<span>🚕</span><h3>ትራንስፖርት</h3><p>መጓጓዣ</p>
</div>

<div class="item" onclick="openService('profile')">
<span>👤</span><h3>መለያዬ</h3><p>የግል መረጃ</p>
</div>

</div>

<!-- SERVICE PAGE -->
<div id="servicePage" class="card hidden">

<button onclick="goHome()" id="backButton">
← ተመለስ
</button>

<h2 id="pageTitle"></h2>

<div id="formArea">

<input id="postTitle" placeholder="ርዕስ">

<textarea id="postDescription"
placeholder="ዝርዝር መግለጫ"></textarea>

<input id="postPrice" type="number"
min="0" placeholder="ዋጋ / መጠን">

<input id="postPhone" type="tel"
placeholder="ስልክ ቁጥር">

<button class="full" onclick="savePost()" id="saveButton">
አስቀምጥ
</button>

</div>

<!-- CHAT -->
<div id="chatArea" class="hidden">

<textarea id="chatMessage"
placeholder="መልዕክብህን ጻፍ"></textarea>

<button class="full" onclick="sendMessage()" id="sendButton">
ላክ
</button>

<div id="messages"></div>

</div>

<!-- PROFILE -->
<div id="profileArea" class="hidden">

<p id="profileName"></p>
<p id="profileEmail"></p>

<button onclick="loadMyPosts()" id="myPostsButton">
የእኔ ማስታወቂያዎች
</button>

</div>

<div id="posts"></div>

</div>

<div class="card">
<button class="full" onclick="logout()" id="logoutButton">
ውጣ / Logout
</button>
</div>

</section>
</div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 query,
 where,
 serverTimestamp,
 limit,
 doc,
 setDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
 apiKey: "AIzaSyCRQJeoRNKSldQ0LTCHoBSUUftl2o-dUjQ",
 authDomain: "all-in-one-45d48.firebaseapp.com",
 projectId: "all-in-one-45d48",
 storageBucket: "all-in-one-45d48.firebasestorage.app",
 messagingSenderId: "1023627656415",
 appId: "1:1023627656415:web:0072d483258742a7bbfd6a"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);


/* VARIABLES */

let isSignup = false;
let currentUser = null;
let currentService = "market";
let language = localStorage.getItem("language") || "am";

const $ = id => document.getElementById(id);


/* SERVICE NAMES */

const names = {
 market:{am:"ገበያ",en:"Market"},
 chat:{am:"ውይይት",en:"Chat"},
 payment:{am:"ክፍያ",en:"Payment"},
 delivery:{am:"ዕቃ ማድረስ",en:"Delivery"},
 jobs:{am:"ሥራ",en:"Jobs"},
 house:{am:"ቤትና መሬት",en:"House & Land"},
 transport:{am:"ትራንስፖርት",en:"Transport"},
 profile:{am:"መለያዬ",en:"My Account"}
};


/* LANGUAGE */

const T = {
 am:{
 header:"ሁሉም አገልግሎቶች በአንድ ቦታ!",
 signup:"አካውንት ፍጠር",
 login:"ወደ አካውንትህ ግባ",
 have:"አካውንት አለህ?",
 nohave:"አካውንት የለህም?",
 services:"ዋና አገልግሎቶች",
 search:"🔍 አገልግሎት ፈልግ...",
 back:"← ተመለስ",
 title:"ርዕስ",
 desc:"ዝርዝር መግለጫ",
 price:"ዋጋ / መጠን",
 phone:"ስልክ ቁጥር",
 save:"አስቀምጥ",
 send:"ላክ",
 chat:"መልዕክብህን ጻፍ",
 logout:"ውጣ",
 my:"የእኔ ማስታወቂያዎች",
 posts:"የተለጠፉ ማስታወቂያዎች",
 none:"ገና ምንም ማስታወቂያ የለም።",
 loading:"በመጫን ላይ...",
 required:"ርዕስና መግለጫ ሙላ።",
 saved:"በተሳካ ሁኔታ ተቀምጧል!",
 seller:"ሻጭ",
 noPhone:"አልተገለጸም",
 noResults:"ምንም ውጤት አልተገኘም።"
 },
 en:{
 header:"All services in one place!",
 signup:"Create Account",
 login:"Login to your account",
 have:"Already have an account?",
 nohave:"Don't have an account?",
 services:"Main Services",
 search:"🔍 Search services...",
 back:"← Back",
 title:"Title",
 desc:"Description",
 price:"Price / Amount",
 phone:"Phone Number",
 save:"Save",
 send:"Send",
 chat:"Write your message",
 logout:"Logout",
 my:"My Advertisements",
 posts:"Published Advertisements",
 none:"No advertisements yet.",
 loading:"Loading...",
 required:"Please enter a title and description.",
 saved:"Saved successfully!",
 seller:"Seller",
 noPhone:"Not provided",
 noResults:"No results found."
 }
};

const t = key => T[language][key] || key;


/* ERROR HANDLING */

function showError(error){

 const code = error?.code || "";

 const map = {
 "auth/email-already-in-use":"ይህ Email ቀድሞ ተመዝግቧል.",
 "auth/invalid-email":"Email ትክክል አይደለም.",
 "auth/weak-password":"Password ቢያንስ 6 ቁምፊዎች ይሁን.",
 "auth/invalid-credential":"Email ወይም Password ትክክል አይደለም.",
 "auth/invalid-api-key":"Firebase API Key አልተቀበለም። Config አረጋግጥ።",
 "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Firebase API Key ትክክል አይደለም።",
 "auth/network-request-failed":"Internet ግንኙነትን አረጋግጥ.",
 "permission-denied":"Firestore Security Rules ፈቃድ አልሰጡም."
 };

 return map[code] || error?.message || "ያልታወቀ ስህተት ተፈጥሯል።";
}


/* LOGIN / SIGNUP */

window.switchAuth = () => {

 isSignup = !isSignup;

 $("nameBox").classList.toggle("hidden",!isSignup);

 $("authTitle").textContent = isSignup ? t("signup") : t("login");

 $("authButton").textContent = isSignup ? "Sign Up" : "Login";

 $("switchText").textContent = isSignup ? t("have") : t("nohave");

 $("switchButton").textContent = isSignup ? "Login" : "Sign Up";

 $("message").textContent = "";
};


window.submitAuth = async () => {

 const name = $("name").value.trim();
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password || (isSignup && !name)){
  $("message").textContent = "እባክህ ሁሉንም ቦታ ሙላ።";
  return;
 }

 if(password.length < 6){
  $("message").textContent = "Password ቢያንስ 6 ቁምፊዎች ይሁን።";
  return;
 }

 $("authButton").disabled = true;
 $("message").textContent = "";

 try{

  if(isSignup){

   const result = await createUserWithEmailAndPassword(
    auth,email,password
   );

   await updateProfile(result.user,{
    displayName:name
   });

   await setDoc(
    doc(db,"users",result.user.uid),
    {
     name:name,
     email:email,
     createdAt:serverTimestamp()
    }
   );

  }else{

   await signInWithEmailAndPassword(
    auth,email,password
   );

  }

 }catch(error){

  $("message").textContent = showError(error);

 }finally{

  $("authButton").disabled = false;

 }

};


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

 currentUser = user;

 $("auth").classList.toggle("hidden",!!user);
 $("app").classList.toggle("hidden",!user);

 if(user){

  $("welcome").textContent =
   (language==="am"?"እንኳን ደህና መጣህ ":"Welcome ") +
   (user.displayName || "");

  $("userEmail").textContent = user.email || "";

 }

});


/* OPEN SERVICES */

window.openService = async service => {

 if(!currentUser)return;

 currentService = service;

 $("servicePage").classList.remove("hidden");

 $("pageTitle").textContent =
  names[service]?.[language] || service;

 $("formArea").classList.toggle(
  "hidden",service==="chat" || service==="profile"
 );

 $("chatArea").classList.toggle(
  "hidden",service!=="chat"
 );

 $("profileArea").classList.toggle(
  "hidden",service!=="profile"
 );

 $("posts").innerHTML = "";

 if(service==="profile"){

  $("profileName").textContent =
   "ስም: " + (currentUser.displayName || "");

  $("profileEmail").textContent =
   "Email: " + currentUser.email;

 }else if(service==="chat"){

  await loadMessages();

 }else{

  await loadPosts(service);

 }

};


/* BACK */

window.goHome = () => {
 $("servicePage").classList.add("hidden");
};


/* SAVE POSTS */

window.savePost = async () => {

 const title = $("postTitle").value.trim();
 const description = $("postDescription").value.trim();
 const price = $("postPrice").value;
 const phone = $("postPhone").value.trim();

 if(!title || !description){
  alert(t("required"));
  return;
 }

 $("saveButton").disabled = true;

 try{

  await addDoc(collection(db,"posts"),{

   category:currentService,
   title:title,
   description:description,
   price:price ? Number(price) : 0,
   phone:phone,
   uid:currentUser.uid,
   author:currentUser.displayName || currentUser.email,
   createdAt:serverTimestamp()

  });

  alert(t("saved"));

  $("postTitle").value = "";
  $("postDescription").value = "";
  $("postPrice").value = "";
  $("postPhone").value = "";

  await loadPosts(currentService);

 }catch(error){

  alert(showError(error));

 }finally{

  $("saveButton").disabled = false;

 }

};


/* DISPLAY POSTS */

function addPostCard(area,data){

 const post = document.createElement("div");
 post.className = "post";

 const title = document.createElement("h3");
 title.textContent = data.title || "";

 const desc = document.createElement("p");
 desc.textContent = data.description || "";

 const price = document.createElement("p");
 price.textContent = t("price") + ": " + (data.price ?? 0);

 const author = document.createElement("p");
 author.className = "small";
 author.textContent = t("seller") + ": " + (data.author || "");

 const phone = document.createElement("p");
 phone.textContent = t("phone") + ": " + (data.phone || t("noPhone"));

 post.append(title,desc,price,author,phone);
 area.appendChild(post);

}


/* LOAD POSTS */

async function loadPosts(category){

 const area = $("posts");
 area.textContent = t("loading");

 try{

  const snap = await getDocs(
   query(
    collection(db,"posts"),
    where("category","==",category),
    limit(50)
   )
  );

  const rows = snap.docs.map(d=>d.data())
   .sort((a,b)=>
    (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
   );

  area.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = t("posts");
  area.appendChild(heading);

  if(!rows.length){

   const p = document.createElement("p");
   p.textContent = t("none");
   area.appendChild(p);
   return;

  }

  rows.forEach(data=>addPostCard(area,data));

 }catch(error){

  area.textContent = showError(error);

 }

}


/* CHAT */

window.sendMessage = async () => {

 const message = $("chatMessage").value.trim();

 if(!message)return;

 $("sendButton").disabled = true;

 try{

  await addDoc(collection(db,"messages"),{

   uid:currentUser.uid,
   name:currentUser.displayName || currentUser.email,
   message:message,
   createdAt:serverTimestamp()

  });

  $("chatMessage").value = "";

  await loadMessages();

 }catch(error){

  alert(showError(error));

 }finally{

  $("sendButton").disabled = false;

 }

};


/* LOAD MESSAGES */

async function loadMessages(){

 const area = $("messages");
 area.textContent = t("loading");

 try{

  const snap = await getDocs(
   query(collection(db,"messages"),limit(50))
  );

  const rows = snap.docs.map(d=>d.data())
   .sort((a,b)=>
    (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)
   );

  area.innerHTML = "<h3>Messages</h3>";

  rows.forEach(data=>{

   const p = document.createElement("p");

   p.textContent =
    (data.name || "User") + ": " + (data.message || "");

   area.appendChild(p);

  });

 }catch(error){

  area.textContent = showError(error);

 }

}


/* MY POSTS */

window.loadMyPosts = async () => {

 const area = $("posts");
 area.textContent = t("loading");

 try{

  const snap = await getDocs(
   query(
    collection(db,"posts"),
    where("uid","==",currentUser.uid),
    limit(50)
   )
  );

  area.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = t("my");
  area.appendChild(heading);

  if(snap.empty){

   const p = document.createElement("p");
   p.textContent = t("none");
   area.appendChild(p);
   return;

  }

  snap.forEach(d=>{

   const data = d.data();

   const p = document.createElement("p");

   p.textContent =
    (data.title || "") + " - " + (data.description || "");

   area.appendChild(p);

  });

 }catch(error){

  area.textContent = showError(error);

 }

};


/* SEARCH */

$("search").addEventListener("input",function(){

 const value = this.value.toLocaleLowerCase();

 document.querySelectorAll(".item").forEach(item=>{

  item.style.display =
   item.innerText.toLocaleLowerCase().includes(value)
   ? "" : "none";

 });

});


/* LANGUAGE SWITCH */

window.setLanguage = lang => {

 if(!T[lang])return;

 language = lang;

 localStorage.setItem("language",lang);

 document.documentElement.lang = lang;

 $("headerText").textContent = t("header");
 $("serviceTitle").textContent = t("services");
 $("search").placeholder = t("search");

 $("logoutButton").textContent = t("logout");
 $("backButton").textContent = t("back");

 $("postTitle").placeholder = t("title");
 $("postDescription").placeholder = t("desc");
 $("postPrice").placeholder = t("price");
 $("postPhone").placeholder = t("phone");

 $("saveButton").textContent = t("save");
 $("sendButton").textContent = t("send");
 $("chatMessage").placeholder = t("chat");

 $("myPostsButton").textContent = t("my");

 document.querySelectorAll(".item").forEach((item,index)=>{

  const key = [
   "market","chat","payment","delivery",
   "jobs","house","transport","profile"
  ][index];

  item.querySelector("h3").textContent = names[key][lang];

 });

 $("authTitle").textContent =
  isSignup ? t("signup") : t("login");

 $("switchText").textContent =
  isSignup ? t("have") : t("nohave");

 $("switchButton").textContent =
  isSignup ? "Login" : "Sign Up";

 $("authButton").textContent =
  isSignup ? "Sign Up" : "Login";

 if(currentUser){

  $("welcome").textContent =
   (lang==="am"?"እንኳን ደህና መጣህ ":"Welcome ") +
   (currentUser.displayName || "");

 }

 if(!$("servicePage").classList.contains("hidden")){

  $("pageTitle").textContent =
   names[currentService][lang];

 }

};


/* LOGOUT */

window.logout = async () => {

 try{

  await signOut(auth);

 }catch(error){

  alert(showError(error));

 }

};


/* INITIAL SETTINGS */

setLanguage(language);

</script>

</body>
</html>
