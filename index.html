
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#008751">
<title>All in One</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}
body{
 background:#f5f5f5;
 color:#333;
 padding-bottom:75px;
}
.header-section{
 background:#008751;
 padding:15px;
 color:white;
}
.top-bar{
 display:flex;
 justify-content:flex-end;
 margin-bottom:15px;
}
.lang-btn{
 background:white;
 color:#008751;
 border:0;
 padding:9px 13px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}
.search-container{
 text-align:center;
 margin-bottom:15px;
}
.search-container h2{
 font-size:18px;
 margin-bottom:12px;
}
.search-box-wrapper{
 display:flex;
 background:white;
 border-radius:8px;
 overflow:hidden;
 padding:4px;
}
.location-select{
 border:0;
 background:#f0f0f0;
 padding:10px 5px;
 border-radius:6px;
 font-size:12px;
 max-width:100px;
}
.search-input{
 flex:1;
 min-width:0;
 border:0;
 padding:10px 5px;
 outline:none;
 font-size:13px;
}
.search-btn{
 border:0;
 background:white;
 color:#008751;
 padding:0 10px;
 font-size:17px;
}
.quick-pills{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:12px 15px;
 background:white;
 white-space:nowrap;
}
.pill{
 background:#f0f4f1;
 border:1px solid #ddd;
 padding:9px 13px;
 border-radius:20px;
 font-size:12px;
 color:#008751;
 text-decoration:none;
}
.container{
 padding:15px;
}
.section-title{
 font-size:16px;
 font-weight:bold;
 margin-bottom:12px;
}
.categories-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 background:white;
 padding:15px;
 border-radius:12px;
 box-shadow:0 2px 5px #0000000d;
}
.cat-card{
 display:flex;
 flex-direction:column;
 align-items:center;
 text-align:center;
 text-decoration:none;
 color:#333;
 padding:8px 3px;
 border-radius:8px;
}
.cat-icon{
 width:50px;
 height:50px;
 background:#f0f4f1;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
 margin-bottom:6px;
}
.cat-card span{
 font-size:12px;
}
.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 background:white;
 display:flex;
 justify-content:space-around;
 padding:10px 0;
 border-top:1px solid #ddd;
 box-shadow:0 -2px 5px #0000000d;
 z-index:1000;
}
.nav-item{
 display:flex;
 flex-direction:column;
 align-items:center;
 text-decoration:none;
 color:#777;
 font-size:11px;
}
.nav-item i{
 font-size:18px;
 margin-bottom:4px;
}
.nav-item.active{
 color:#008751;
 font-weight:bold;
}
@media(max-width:350px){
 .categories-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="header-section">

 <div class="top-bar">
  <button class="lang-btn" onclick="toggleLanguage()">
   <i class="fa-solid fa-globe"></i>
   <span id="languageButton">English</span>
  </button>
 </div>

 <div class="search-container">
  <h2 data-am="ምን ይፈልጋሉ?"
      data-en="What are you looking for?">
      ምን ይፈልጋሉ?
  </h2>

  <div class="search-box-wrapper">
   <select class="location-select">
    <option data-am="ኢትዮጵያ" data-en="Ethiopia">ኢትዮጵያ</option>
    <option data-am="አዲስ አበባ" data-en="Addis Ababa">አዲስ አበባ</option>
   </select>

   <input type="text"
    class="search-input"
    data-placeholder-am="እቃዎችን ወይም አገልግሎቶችን ይፈልጉ..."
    data-placeholder-en="Search products or services..."
    placeholder="እቃዎችን ወይም አገልግሎቶችን ይፈልጉ...">

   <button class="search-btn">
    <i class="fa-solid fa-magnifying-glass"></i>
   </button>
  </div>
 </div>
</div>

<div class="quick-pills">
 <a href="#" class="pill">
  <i class="fa-solid fa-bullseye"></i>
  <span data-am="ንቁ መረጃዎች" data-en="Featured">ንቁ መረጃዎች</span>
 </a>

 <a href="#" class="pill">
  <i class="fa-solid fa-store"></i>
  <span data-am="እንዴት መሸጥ ይቻላል?"
        data-en="How to sell?">እንዴት መሸጥ ይቻላል?</span>
 </a>

 <a href="#" class="pill">
  <i class="fa-solid fa-gamepad"></i>
  <span data-am="ጨዋታዎች" data-en="Games">ጨዋታዎች</span>
 </a>
</div>

<div class="container">

 <div class="section-title"
  data-am="ዋና አገልግሎቶች"
  data-en="Main Services">
  ዋና አገልግሎቶች
 </div>

 <div class="categories-grid">

  <a href="#" class="cat-card">
   <div class="cat-icon">🛒</div>
   <span data-am="ገበያ" data-en="Market">ገበያ</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">💬</div>
   <span data-am="ውይይት" data-en="Chat">ውይይት</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">💳</div>
   <span data-am="ክፍያ" data-en="Payment">ክፍያ</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">🚚</div>
   <span data-am="ዕቃ ማድረስ" data-en="Delivery">ዕቃ ማድረስ</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">💼</div>
   <span data-am="ሥራ" data-en="Jobs">ሥራ</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">🏠</div>
   <span data-am="ቤትና መሬት" data-en="House & Land">ቤትና መሬት</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">🚕</div>
   <span data-am="ትራንስፖርት" data-en="Transport">ትራንስፖርት</span>
  </a>

  <a href="#" class="cat-card">
   <div class="cat-icon">👤</div>
   <span data-am="መለያዬ" data-en="My Account">መለያዬ</span>
  </a>

 </div>
</div>

<div class="bottom-nav">

 <a href="#" class="nav-item active">
  <i class="fa-solid fa-house"></i>
  <span data-am="መነሻ" data-en="Home">መነሻ</span>
 </a>

 <a href="#" class="nav-item">
  <i class="fa-solid fa-bookmark"></i>
  <span data-am="የተቀመጡ" data-en="Saved">የተቀመጡ</span>
 </a>

 <a href="#" class="nav-item">
  <i class="fa-solid fa-square-plus"
     style="font-size:22px;color:#008751"></i>
  <span data-am="ሽያጭ" data-en="Sell">ሽያጭ</span>
 </a>

 <a href="#" class="nav-item">
  <i class="fa-solid fa-comment-dots"></i>
  <span data-am="መልዕክቶች" data-en="Messages">መልዕክቶች</span>
 </a>

 <a href="#" class="nav-item">
  <i class="fa-solid fa-user"></i>
  <span data-am="መገለጫ" data-en="Profile">መገለጫ</span>
 </a>

</div>

<script>

let currentLanguage =
 localStorage.getItem("allInOneLanguage") || "am";

function setLanguage(lang){

 currentLanguage = lang;

 document.documentElement.lang = lang;

 localStorage.setItem("allInOneLanguage",lang);

 document.querySelectorAll("[data-am]").forEach(element=>{

  element.textContent = element.getAttribute(
   lang === "am" ? "data-am" : "data-en"
  );

 });

 document.querySelectorAll("[data-placeholder-am]").forEach(element=>{

  element.placeholder = element.getAttribute(
   lang === "am"
   ? "data-placeholder-am"
   : "data-placeholder-en"
  );

 });

 document.getElementById("languageButton").textContent =
  lang === "am" ? "English" : "አማርኛ";

}

function toggleLanguage(){

 setLanguage(currentLanguage === "am" ? "en" : "am");

}

setLanguage(currentLanguage);

</script>

</body>
</html>
